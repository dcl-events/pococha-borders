<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pococha ボーダー推移</title>

<link rel="apple-touch-icon" href="../assets/dcl_mark.png">
<style>
  :root{ --bg1:#fff5fb; --bg2:#f0ecff; --card:#ffffff; --border:#f3e6f2; --text:#3a2e4d; --sub:#a596bb;
         --pink:#ff6fae; --purple:#8f6bff; --accent:#e75c9c;
         --soft:#ffe6f2; --soft2:#efe8ff; --hot:#ff4f97;
         --grad:linear-gradient(90deg,#ff6fae,#8f6bff); --shadow:rgba(226,110,170,.16); }
  @media (prefers-color-scheme:dark){
    :root{ --bg1:#1b1526; --bg2:#171029; --card:#241b33; --border:#372c4a; --text:#f2ecfb; --sub:#a99ec2;
           --pink:#ff8bbd; --purple:#a98bff; --accent:#ff8bbd;
           --soft:#3a2740; --soft2:#2c2442; --hot:#ff8bbd;
           --grad:linear-gradient(90deg,#ff8bbd,#a98bff); --shadow:rgba(0,0,0,.35); }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:24px 14px 44px; color:var(--text); min-height:100vh;
        background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 100%); background-attachment:fixed;
        font-family:"Hiragino Maru Gothic ProN",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
  .app{ max-width:820px; margin:0 auto; }
  .brandbar{ display:flex; justify-content:center; margin:2px 0 16px; }
  .brandbar img{ height:34px; width:auto; }
  h1{ font-size:24px; font-weight:800; margin:0 0 6px; text-align:center; letter-spacing:.5px;
      background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lead{ font-size:12.5px; color:var(--sub); margin:0 0 20px; text-align:center; line-height:1.6; }
  footer{ color:var(--sub); font-size:11.5px; margin-top:24px; text-align:center; }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  select{ font-size:13px; font-weight:700; padding:8px 12px; border-radius:14px; color:var(--text);
          border:1.5px solid var(--border); background:var(--card); box-shadow:0 2px 8px var(--shadow); }
  .tabs{ display:inline-flex; background:var(--soft2); border-radius:999px; padding:3px; gap:2px; }
  .tab{ font-size:13px; font-weight:800; padding:7px 16px; border-radius:999px; cursor:pointer;
        color:var(--sub); border:none; background:transparent; }
  .tab.active{ background:var(--grad); color:#fff; box-shadow:0 3px 10px var(--shadow); }
  .backlink{ margin-left:auto; text-decoration:none; font-size:13px; font-weight:800;
             padding:8px 16px; border-radius:999px; border:none; background:var(--soft); color:var(--accent);
             display:inline-flex; align-items:center; gap:3px; }
  .backlink:hover{ filter:brightness(.97); }
  .card{ background:var(--card); border:1.5px solid var(--border); border-radius:24px; padding:20px;
         margin-bottom:14px; box-shadow:0 10px 30px var(--shadow); }
  .chead{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; }
  .ttl{ font-size:16px; font-weight:800; }
  .sub{ font-size:12px; color:var(--sub); margin-top:3px; }
  .stat{ text-align:right; flex-shrink:0; }
  .statnum{ font-size:26px; font-weight:900; line-height:1;
            background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .statnum small{ font-size:14px; margin-left:1px; }
  .statlbl{ font-size:11px; color:var(--sub); margin-top:3px; }
  .chartwrap{ position:relative; touch-action:pan-y; }
  svg.chart{ width:100%; height:210px; overflow:visible; display:block; cursor:pointer; }
  .gs0{ stop-color:#ff6fae; } .gs1{ stop-color:#8f6bff; }
  .ags0{ stop-color:#ff6fae; stop-opacity:.28; } .ags1{ stop-color:#8f6bff; stop-opacity:0; }
  @media (prefers-color-scheme:dark){
    .gs0{ stop-color:#ff8bbd; } .gs1{ stop-color:#a98bff; }
    .ags0{ stop-color:#ff8bbd; stop-opacity:.24; } .ags1{ stop-color:#a98bff; stop-opacity:0; }
  }
  .daydot{ fill:var(--purple); opacity:.28; }
  #guide{ stroke:var(--purple); stroke-width:1.5; stroke-dasharray:3 3; opacity:0; pointer-events:none; }
  #hoverdot{ fill:var(--purple); stroke:var(--card); stroke-width:2.5; opacity:0; pointer-events:none; }
  .tip{ position:absolute; top:2px; transform:translateX(-50%); pointer-events:none; opacity:0;
        transition:opacity .1s; background:var(--card); border:1.5px solid var(--border); border-radius:16px;
        padding:8px 12px; box-shadow:0 8px 22px var(--shadow); white-space:nowrap; text-align:center; }
  .tip .tipd{ display:block; font-size:11px; color:var(--sub); font-weight:700; }
  .tip .tipv{ display:block; font-size:16px; font-weight:900; margin-top:1px;
              background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tip .tipbtn{ display:block; margin-top:8px; pointer-events:auto; cursor:pointer; border:none;
    border-radius:999px; background:var(--grad); color:#fff; font-size:11px; font-weight:800;
    padding:7px 14px; white-space:nowrap; width:100%; box-shadow:0 3px 10px var(--shadow); }
  .tip .tipbtn:active{ transform:scale(.97); }
  .charthint{ font-size:11px; color:var(--sub); text-align:center; margin-top:12px; }
  .line{ fill:none; stroke:url(#lineGrad); stroke-width:3.2; stroke-linejoin:round; stroke-linecap:round; }
  .area{ fill:url(#areaGrad); }
  .medline{ stroke:var(--border); stroke-width:1.5; stroke-dasharray:4 4; }
  .lbl{ fill:var(--sub); font-size:11px; font-weight:600; }
  .dot{ fill:var(--pink); stroke:var(--card); stroke-width:2.5; }
  .dotlbl{ fill:var(--hot); font-size:12.5px; font-weight:800; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:600px){ .row{ grid-template-columns:1fr; } }
  .minihd{ font-size:14px; font-weight:800; margin-bottom:16px; }
  .rangebar{ display:flex; align-items:center; gap:8px; }
  .rmin,.rmax{ font-size:12px; font-weight:800; color:var(--sub); white-space:nowrap; }
  .track{ position:relative; flex:1; height:12px; background:var(--soft2); border-radius:999px; }
  .band{ position:absolute; top:0; bottom:0; background:var(--grad); border-radius:999px; opacity:.55; }
  .med{ position:absolute; top:-3px; width:4px; height:18px; background:var(--purple); border-radius:999px;
        box-shadow:0 0 0 3px var(--card); }
  .rlabels{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--sub); margin-top:9px; }
  .rlabels b{ color:var(--accent); font-weight:800; }
  .note{ font-size:12px; color:var(--sub); margin-top:14px; line-height:1.6; }
  .note b{ color:var(--accent); font-weight:800; }
  .bars{ display:flex; align-items:flex-end; gap:7px; height:130px; }
  .bar{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
  .bar em{ font-size:10px; font-style:normal; font-weight:800; color:var(--sub); margin-bottom:5px; white-space:nowrap; }
  .bar.hot em{ color:var(--accent); }
  .bar i{ width:100%; background:var(--soft); border-radius:8px 8px 0 0; }
  .bar.hot i{ background:var(--grad); }
  .bar b{ font-size:11px; font-weight:700; color:var(--sub); margin-top:6px; }
  .foot{ font-size:11px; color:var(--sub); text-align:center; margin-top:6px; }
</style>

      <div class="bars" id="wbars"></div>
      <div class="note" id="wNote"></div>

  </div>
  <footer>DeNA Creator Links ✨ Pocochaボーダー推移／毎朝10:00 更新</footer>

er":1148,"normal":224},{"iso":"2026-08-07","d":"08/07","top":4613,"upper":1683,"normal":244},{"iso":"2026-08-08","d":"08/08","top":3992,"upper":2407,"normal":282},{"iso":"2026-08-09","d":"08/09","top":4324,"upper":2278,"normal":273},{"iso":"2026-08-10","d":"08/10","top":4195,"upper":2205,"normal":282},{"iso":"2026-08-11","d":"08/11","top":3994,"upper":2181,"normal":310},{"iso":"2026-08-12","d":"08/12","top":4509,"upper":2301,"normal":282},{"iso":"2026-08-13","d":"08/13","top":3723,"upper":1886,"normal":253},{"iso":"2026-08-14","d":"08/14","top":2443,"upper":1599,"normal":234},{"iso":"2026-08-15","d":"08/15","top":4386,"upper":1789,"normal":270},{"iso":"2026-08-16","d":"08/16","top":2330,"upper":1174,"normal":223},{"iso":"2026-08-17","d":"08/17","top":3028,"upper":1348,"normal":234},{"iso":"2026-08-18","d":"08/18","top":2230,"upper":1127,"normal":221}]}};
const RANKS = ["S6", "S5", "S4", "S3", "S2", "S1", "A3", "A2", "A1", "B3", "B2", "B1", "C3", "C2", "C1", "D3", "D2", "D1", "E1"];
const CTS = ["22", "24", "13"];
const TIER_LABEL = {top:"+2", upper:"+1", normal:"±0"};
const TIER_DESC = {top:"2ランクアップ", upper:"1ランクアップ", normal:"現ランク維持"};
const WD = ["月","火","水","木","金","土","日"];
const WDJP = ["日","月","火","水","木","金","土"];   // getDay() 0=日
let state = { rank: RANKS.includes("S3") ? "S3" : RANKS[0], ct: CTS[0], tier: "normal" };
let chartState = { pts: [] };

const man = v => (v/1e4);
const fmtMan = v => (v==null? "-" : (Math.round(v/1e3)/10).toFixed(1)+"万");

function series(){
  const arr = (DATA[state.ct] && DATA[state.ct][state.rank]) || [];
  return arr.map(p => ({ iso:p.iso, d:p.d, v:p[state.tier] })).filter(p => p.v!=null);
}
function median(nums){ const s=[...nums].sort((a,b)=>a-b); const n=s.length; if(!n) return null;
  return n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; }

function render(){
  // selectors
  document.getElementById("rank").value = state.rank;
  document.getElementById("ct").value = state.ct;
  const bl = document.getElementById("backLink"); if(bl) bl.href = "../?ct=" + state.ct;
  [...document.querySelectorAll(".tab")].forEach(t=>t.classList.toggle("active", t.dataset.tier===state.tier));

  const all = series();
  const last14 = all.slice(-14);
  const recent = all.slice(-30);            // レンジ・曜日別は直近30日で相場を今に寄せる
  const vals = recent.map(p=>p.v);
  const med = median(vals), mn = Math.min(...vals), mx = Math.max(...vals);

  document.getElementById("chartTtl").textContent = `📈 ${state.rank} ${TIER_LABEL[state.tier]} の推移`;
  document.getElementById("chartSub").textContent = `締め${state.ct}時 ／ 直近${last14.length}日（${TIER_DESC[state.tier]}）`;
  document.getElementById("medBig").innerHTML = fmtMan(med).replace("万","<small>万</small>");

  drawChart(last14, med);

  // range
  const pct = v => ((v-mn)/(mx-mn||1))*100;
  document.getElementById("rmin").textContent = fmtMan(mn);
  document.getElementById("rmax").textContent = fmtMan(mx);
  document.getElementById("rmed").textContent = fmtMan(med);
  const q1 = median(vals.filter(v=>v<=med)), q3 = median(vals.filter(v=>v>=med));
  const band = document.getElementById("band");
  band.style.left = pct(q1)+"%"; band.style.right = (100-pct(q3))+"%";
  document.getElementById("medMark").style.left = pct(med)+"%";
  document.getElementById("rangeNote").innerHTML =
    `直近${vals.length}日の実績は <b>${fmtMan(mn)}〜${fmtMan(mx)}</b>。<br>` +
    `半分の日は <b>${fmtMan(q1)}〜${fmtMan(q3)}</b> に収まる。`;

  // weekday（直近30日）
  const wsum = Array.from({length:7},()=>[]);
  recent.forEach(p=>{ const wd=(new Date(p.iso).getDay()+6)%7; wsum[wd].push(p.v); });
  const wavg = wsum.map(a=> a.length? a.reduce((x,y)=>x+y,0)/a.length : null);
  const wvalid = wavg.filter(v=>v!=null);
  const wmax = Math.max(...wvalid), wmin = Math.min(...wvalid);
  const bars = wavg.map((v,i)=>{
    if(v==null) return `<div class="bar"><em>-</em><i style="height:0"></i><b>${WD[i]}</b></div>`;
    const h = 30 + (v-wmin)/((wmax-wmin)||1)*70;
    const hot = v===wmax ? " hot":"";
    return `<div class="bar${hot}"><em>${fmtMan(v)}</em><i style="height:${h}%"></i><b>${WD[i]}</b></div>`;
  }).join("");
  document.getElementById("wbars").innerHTML = bars;
  const we = median([wavg[5],wavg[6]].filter(v=>v!=null));
  const wk = median([wavg[0],wavg[1],wavg[2],wavg[3],wavg[4]].filter(v=>v!=null));
  const ratio = wk? (we/wk):1;
  const flat = Math.abs(ratio-1) < 0.12;
  document.getElementById("wNote").innerHTML = flat
    ? `→ 曜日差は <b>ほぼ無し</b>（週末${ratio.toFixed(2)}倍）。いつ走っても条件は近い。`
    : `→ 週末は平日の <b>${ratio.toFixed(2)}倍</b>。狙い目を意識。`;
}

function drawChart(pts, med){
  const chart = document.getElementById("chart");
  // 実表示幅に合わせて viewBox を組む＝横に引き伸ばさない → 文字が潰れない
  const W = Math.max(280, Math.round(chart.clientWidth || 720));
  const H=210, padL=8,padR=8,padT=18,padB=26;
  chart.setAttribute("viewBox", "0 0 " + W + " " + H);
  const vals=pts.map(p=>p.v);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  const span=(mx-mn)||1; mn-=span*0.15; mx+=span*0.15;
  const x=i=> padL + i*( (W-padL-padR)/Math.max(1,pts.length-1) );
  const y=v=> padT + (1-(v-mn)/(mx-mn))*(H-padT-padB);
  const line = pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = `${padL},${H-padB} ${line} ${x(pts.length-1)},${H-padB}`;
  const ymed = y(med);
  const last = pts[pts.length-1];
  const lx=x(pts.length-1), ly=y(last.v);
  const labels = pts.map((p,i)=> (i===0||i===pts.length-1||i===Math.floor(pts.length/2))
    ? `<text class="lbl" x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${p.d}</text>`:"").join("");
  const daydots = pts.map((p,i)=>`<circle class="daydot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.6"/>`).join("");
  const svg = `
    <defs>
      <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop class="gs0" offset="0"/><stop class="gs1" offset="1"/>
      </linearGradient>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop class="ags0" offset="0"/><stop class="ags1" offset="1"/>
      </linearGradient>
    </defs>
    <polyline class="area" points="${area}"/>
    <line class="medline" x1="${padL}" y1="${ymed.toFixed(1)}" x2="${W-padR}" y2="${ymed.toFixed(1)}"/>
    <text class="lbl" x="${padL+4}" y="${(ymed-5).toFixed(1)}">中央値 ${fmtMan(med)}</text>
    <polyline class="line" points="${line}"/>
    ${daydots}
    <line id="guide" x1="0" y1="${padT}" x2="0" y2="${H-padB}"/>
    <circle class="dot" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5.5"/>
    <text class="dotlbl" x="${(lx-6).toFixed(1)}" y="${(ly-10).toFixed(1)}" text-anchor="end">${fmtMan(last.v)}</text>
    <circle id="hoverdot" cx="0" cy="0" r="5"/>
    ${labels}`;
  chart.innerHTML = svg;
  // ポインタ操作用に各点のビューボックス座標＋データを保持
  chartState = { W: W, pts: pts.map((p,i)=>({ x:x(i), y:y(p.v), iso:p.iso, d:p.d, v:p.v })) };
}

// build controls
const rankSel=document.getElementById("rank");
RANKS.forEach(r=> rankSel.appendChild(Object.assign(document.createElement("option"),{value:r,textContent:r+" ランク"})));
const ctSel=document.getElementById("ct");
CTS.forEach(c=> ctSel.appendChild(Object.assign(document.createElement("option"),{value:c,textContent:"締め "+c+"時"})));
const tabs=document.getElementById("tabs");
[["top","+2"],["upper","+1"],["normal","±0"]].forEach(([t,l])=>{
  const b=document.createElement("button"); b.className="tab"; b.dataset.tier=t; b.textContent=l;
  b.onclick=()=>{ state.tier=t; render(); }; tabs.appendChild(b);
});
rankSel.onchange=e=>{ state.rank=e.target.value; render(); };
ctSel.onchange=e=>{ state.ct=e.target.value; render(); };

// ----- チャートの日別カーソル（なぞる=小窓表示 / タップ=早見表へ） -----
const chartEl = document.getElementById("chart");
const tip = document.getElementById("tip");
function nearest(e){
  if(!chartState.pts.length) return null;
  const rect = chartEl.getBoundingClientRect();
  const cx = (e.clientX - rect.left)/rect.width*(chartState.W || 720);
  let bi=0, bd=1e9;
  chartState.pts.forEach((p,i)=>{ const d=Math.abs(p.x-cx); if(d<bd){ bd=d; bi=i; } });
  return { p: chartState.pts[bi], rect };
}
let selIso = null;
function showTip(e){
  const n = nearest(e); if(!n) return;
  const { p, rect } = n;
  const g=document.getElementById("guide"), hd=document.getElementById("hoverdot");
  if(g){ g.setAttribute("x1",p.x); g.setAttribute("x2",p.x); g.style.opacity=1; }
  if(hd){ hd.setAttribute("cx",p.x); hd.setAttribute("cy",p.y); hd.style.opacity=1; }
  const half=60;
  let leftPx = (p.x/(chartState.W || 720))*rect.width;
  leftPx = Math.max(half, Math.min(rect.width-half, leftPx));
  tip.style.left = leftPx+"px";
  const wd = WDJP[new Date(p.iso).getDay()];
  tip.querySelector(".tipd").textContent = p.d + "（" + wd + "）";
  tip.querySelector(".tipv").textContent = fmtMan(p.v);
  selIso = p.iso;
  tip.style.opacity=1;
}
function hideTip(){
  tip.style.opacity=0;
  const g=document.getElementById("guide"), hd=document.getElementById("hoverdot");
  if(g) g.style.opacity=0; if(hd) hd.style.opacity=0;
}
// 小窓の「早見表で見る」ボタンだけがジャンプ。チャートのタップ／ホバーは数値表示のみ＝誤爆なし。
document.getElementById("tipBtn").addEventListener("click", function(ev){
  ev.stopPropagation();
  if(selIso) location.href = "../?date=" + selIso + "&ct=" + state.ct;
});
chartEl.addEventListener("pointermove", showTip);
chartEl.addEventListener("pointerdown", showTip);
// 画面幅が変わったら実幅で描き直す（回転・リサイズ時に文字が潰れないように）
let _rzTimer;
window.addEventListener("resize", function(){ clearTimeout(_rzTimer); _rzTimer=setTimeout(function(){ hideTip(); render(); }, 150); });
// 自動では消さない（PCで小窓のボタンへマウスを運ぶ途中で消えるのを防ぐ／スマホでも保持）。
// チャート外をタップ／クリックしたら閉じる。
document.addEventListener("pointerdown", function(e){
  if(!e.target.closest(".chartwrap")) hideTip();
});

// ----- URL 深リンク（早見表から ?rank=S3&ct=22 で着地） -----
(function(){
  try{
    const sp = new URLSearchParams(location.search);
    const r = sp.get("rank");            if(r && RANKS.includes(r)) state.rank=r;
    const c = sp.get("ct")||sp.get("time"); if(c && CTS.includes(c))  state.ct=c;
    const t = sp.get("tier");            if(["top","upper","normal"].includes(t)) state.tier=t;
    const tl = {"+2":"top","+1":"upper","±0":"normal"}[t]; if(tl) state.tier=tl;
  }catch(e){}
})();

render();
</script>
