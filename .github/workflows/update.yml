name: Daily update & deploy

on:
  # ★本命：外部スケジューラ(cron-job.org等)が毎朝10:00 JST丁度にこれを叩く＝時刻が正確
  #   POST /repos/dcl-events/pococha-borders/dispatches  {"event_type":"daily-update"}
  repository_dispatch:
    types: [daily-update]
  # 保険：GitHub純正スケジュール（遅延しがちだが、外部トリガーが落ちた日でも必ず1回は更新される）
  schedule:
    - cron: '27 1 * * *'     # 01:27 UTC = 10:27 JST
    - cron: '27 3 * * *'     # 03:27 UTC = 12:27 JST（遅延時の保険）
  workflow_dispatch:          # 画面から手動実行も可能

# Pages は「ブランチ公開（main:/docs）」に設定済み。
# この workflow は docs を作り直して push するだけでよく、push を受けて
# GitHub 純正の pages-build-deployment が自動配信する（artifact/deploy-pages は使わない＝競合しない）。
permissions:
  contents: write             # history.json / docs を自動コミット＆push するため

# 同一 workflow の多重起動だけ直列化（古い実行はキャンセルして最新を優先）
concurrency:
  group: borders-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # fetch.py / build.py は標準ライブラリのみ。pip install 不要。

      - name: 取得 & 生成
        run: |
          python fetch.py
          python build.py
          python build_trend.py

      - name: 変更を自動コミット＆push（push で Pages が自動配信）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update borders (auto, cloud)"
            # 他の push と競合しても自動で取り込んで再push（夜間の衝突対策）
            for i in 1 2 3; do
              git push && break
              echo "push 競合 → pull --rebase して再試行 ($i)"
              git pull --rebase --autostash origin main || true
            done
          fi
