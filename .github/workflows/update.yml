name: Daily update & deploy

on:
  # ★本命：外部スケジューラ(cron-job.org等)が毎朝10:00 JST丁度にこれを叩く＝時刻が正確
  #   POST /repos/dcl-events/pococha-borders/dispatches  {"event_type":"daily-update"}
  repository_dispatch:
    types: [daily-update]
  # 保険：GitHub純正スケジュール（遅延しがちだが、外部トリガーが落ちた日でも必ず1回は更新される）
  schedule:
    - cron: '27 1 * * *'     # 01:27 UTC = 10:27 JST
    - cron: '27 3 * * *'     # 03:27 UTC = 12:27 JST（遅延時の保険）
  workflow_dispatch:          # 画面から手動実行も可能

permissions:
  contents: write             # history.json / docs を自動コミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # fetch.py / build.py は標準ライブラリのみ。pip install 不要。

      - name: 取得 & 生成
        run: |
          python fetch.py
          python build.py
          python build_trend.py

      - name: 変更を自動コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update borders (auto, cloud)"
            git push
          fi

      - name: Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: GitHub Pages へデプロイ
        id: deploy
        uses: actions/deploy-pages@v4
