name: Daily update & deploy

on:
  schedule:
    # GitHub のスケジュールは混雑で数時間遅延/スキップされることがある。
    # 朝の枠を複数用意し「どれか1つでも定刻近くに当たる」ようにする。
    # 処理は変化がある時だけcommitする冪等設計なので、何度走っても二重更新にはならない。
    - cron: '27 1 * * *'     # 01:27 UTC = 10:27 JST（本命）
    - cron: '52 1 * * *'     # 01:52 UTC = 10:52 JST
    - cron: '17 2 * * *'     # 02:17 UTC = 11:17 JST
    - cron: '27 3 * * *'     # 03:27 UTC = 12:27 JST（遅延時の保険）
  workflow_dispatch:          # 画面から手動実行も可能

permissions:
  contents: write             # history.json / docs を自動コミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # fetch.py / build.py は標準ライブラリのみ。pip install 不要。

      - name: 取得 & 生成
        run: |
          python fetch.py
          python build.py
          python build_trend.py

      - name: 変更を自動コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update borders (auto, cloud)"
            git push
          fi

      - name: Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: GitHub Pages へデプロイ
        id: deploy
        uses: actions/deploy-pages@v4
